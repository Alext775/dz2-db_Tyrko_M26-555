[project]
name = "primitive-db"
version = "0.1.0"
description = "Консольная база данных с CRUD-операциями и JSON-хранением"
readme = "README.md"
authors = [
    { name = "Alext775", email = "alext77553@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
]

[project.scripts]
database = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
